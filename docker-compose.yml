version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fl_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_literacy_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financial_literacy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fl_network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: fl_ml_service
    restart: always
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fl_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fl_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/financial_literacy_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8000}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fl_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fl_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
      - ml-service
    networks:
      - fl_network

networks:
  fl_network:
    driver: bridge

volumes:
  postgres_data:
